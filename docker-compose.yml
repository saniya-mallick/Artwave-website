services:
  web:
    build: .
    container_name: artwave-php
    ports:
      - "8081:80"
    volumes:
      - ./Saniya_Mallick/code:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: artwave-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: music_db
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password